name: Release Please

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # No `release-type` input on purpose: with it the action builds its config from the
      # inputs alone and never reads release-please-config.json, so bump-minor-pre-major and
      # bump-patch-for-minor-pre-major would not apply and a breaking change would cut 1.0.0.
      # Without it the action reads release-please-config.json and .release-please-manifest.json.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release

  # The ONE publish path: the PyPI trusted publisher for `amazing-gmail-mcp` is registered
  # against THIS workflow and this job, chained to release-please. There is no workflow on
  # `release: published` (a manual release from any tag would publish too). Every action is
  # pinned to a commit SHA: a retargeted tag must not be able to mint the OIDC token.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: ".python-version"
      # The job that can mint the OIDC token never restores a cache another job saved.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv build
      - run: uv publish
