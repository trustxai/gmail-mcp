[project]
name = "amazing-gmail-mcp"
version = "0.0.0"
description = "Read-only MCP server for one Gmail mailbox (gmail.readonly by construction, account pinned, stdio only)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alejandro Latorre" }]
keywords = [
    "python",
    "gmail",
    "email",
    "mcp",
    "llm-tools",
    "model-context-protocol",
    "mcp-server",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Communications :: Email",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.13"
dependencies = [
    # Capped below 2.0: the SDK's 2.x line drops `mcp.server.fastmcp` and moves `mcp.types`
    # out to a separate package, so an unbounded spec makes `uvx amazing-gmail-mcp` resolve to
    # 2.x and die on import. Floor 1.21.1: older releases import a pydantic internal that
    # current pydantic no longer has (measured in amazing-slack-mcp).
    "mcp>=1.21.1,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/trustxai/gmail-mcp"
Repository = "https://github.com/trustxai/gmail-mcp"
Issues = "https://github.com/trustxai/gmail-mcp/issues"
Changelog = "https://github.com/trustxai/gmail-mcp/blob/main/CHANGELOG.md"

[project.scripts]
# Dist + server script are both `amazing-gmail-mcp` (ADR-0001 D1: `gmail-mcp` is taken on
# PyPI) so `uvx amazing-gmail-mcp` resolves with no --from. stdio only: the refresh token
# reads a whole mailbox and never leaves the machine, so there is no http entry point.
amazing-gmail-mcp = "gmail_mcp.server:main_stdio"
# Mints the gmail.readonly refresh token once per company, from a Mac (ADR-0001 D3).
amazing-gmail-mcp-login = "gmail_mcp.login:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_mcp"]

[dependency-groups]
dev = [
    # mcp[cli] provides the `mcp` dev CLI (mcp dev / inspector); the runtime server needs
    # only core `mcp`, so the CLI extra lives here.
    "mcp[cli]>=1.21.1,<2",
    "pre-commit>=4.0",
    "ruff>=0.11",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: read-only integration tests against the real mailbox (skipped unless GMAIL_REFRESH_TOKEN is set; never in CI)",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["mcp", "pydantic", "httpx"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["gmail_mcp.*"]
disallow_untyped_defs = true
